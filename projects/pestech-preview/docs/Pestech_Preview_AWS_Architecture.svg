<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="1740" viewBox="0 0 2480 1740" role="img" aria-labelledby="title desc">
<title id="title">Pestech AWS Preview Architecture</title>
<desc id="desc">Terraform-managed CloudFront HTTPS delivery to Nginx on EC2 in a public VPC subnet. A WSL workstation uploads a release archive to private S3 and sends SSM Run Command instructions. The EC2 role permits the agent to run commands and download the approved release. Verified November 6, 2026.</desc>
