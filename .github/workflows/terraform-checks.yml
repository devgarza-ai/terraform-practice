name: Terraform checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

env:
  TF_IN_AUTOMATION: "true"
  CHECKPOINT_DISABLE: "1"

jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check structure, links, and publication inputs
        run: python3 scripts/check_repository.py

  terraform:
    name: Validate ${{ matrix.exercise }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        exercise:
          - 01-vpc-foundations
          - 03-first-s3-project
          - 04-s3-backend
          - 05-ec2-nginx
          - 06-s3-static-website
          - 07-data-sources
          - 08-input-vars-local-outputs
    defaults:
      run:
        working-directory: ${{ matrix.exercise }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.0
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -diff -recursive
      - name: Initialize without the backend
        run: terraform init -backend=false -input=false -lockfile=readonly
      - name: Validate configuration
        run: terraform validate -no-color
      - name: Test input-variable behavior without AWS
        if: matrix.exercise == '08-input-vars-local-outputs'
        run: terraform test -no-color
